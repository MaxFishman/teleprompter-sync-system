<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Teleprompter Sync System — Backup rig</title>
<style>
  :root{
    --panel-0:#101317; --panel-1:#171b21; --panel-2:#1f242b; --well:#0c0e12;
    --hair:#2a3038; --ink:#edeff2; --ink-dim:#7e8893; --ink-faint:#525b65;
    --amber:#f4a836; --amber-soft:#f6bd63; --amber-glow:rgba(244,168,54,.55);
    --link:#53e08a; --link-glow:rgba(83,224,138,.55);
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{ font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,#1a1f26 0%,var(--panel-0) 55%);
    display:flex; align-items:center; justify-content:center; padding:30px;
    -webkit-font-smoothing:antialiased; user-select:none; }
  .card{ width:100%; max-width:440px; text-align:center;
    background:linear-gradient(180deg,var(--panel-2),var(--panel-1));
    border:1px solid var(--hair); border-radius:20px; padding:36px 30px 30px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 40px 80px -40px #000; }
  .status-lamp{ width:62px; height:62px; border-radius:50%; margin:0 auto 20px; position:relative;
    background:#3a4049; box-shadow:0 0 0 1px #000 inset; transition:.3s; }
  .status-lamp.live{ background:radial-gradient(circle at 40% 35%,#8ff0b8,var(--link));
    box-shadow:0 0 34px var(--link-glow), 0 0 0 1px #0a1a10 inset; }
  .status-lamp.live::after{ content:""; position:absolute; inset:-9px; border-radius:50%;
    border:2px solid var(--link); opacity:.5; animation:pulse 2s ease-out infinite; }
  @keyframes pulse{ 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.5);opacity:0} }
  @media (prefers-reduced-motion:reduce){ .status-lamp.live::after{ animation:none } }
  h1{ font-size:20px; font-weight:650; letter-spacing:.01em }
  .state{ font-size:13.5px; color:var(--ink-dim); margin-top:7px }
  .rows{ margin:24px 0 8px; text-align:left;
    background:var(--well); border:1px solid #000; border-radius:13px; padding:4px 16px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:13px 0; border-top:1px solid #ffffff08; font-size:13.5px; }
  .row:first-child{ border-top:0 }
  .row .k{ color:var(--ink-faint) }
  .row .v{ font-family:var(--mono); color:var(--ink); text-align:right; word-break:break-all }
  .warn{ font-size:12.5px; color:var(--amber-soft); line-height:1.5; margin:16px 2px 0; display:none }
  .warn.show{ display:block }
  .leave{ width:100%; margin-top:22px; min-height:50px; cursor:pointer;
    font-family:var(--sans); font-size:15px; color:var(--ink);
    background:linear-gradient(180deg,#262c34,#1a1f26); border:1px solid var(--hair);
    border-radius:12px; transition:transform .06s, box-shadow .15s }
  .leave:hover{ box-shadow:0 0 0 1px #5a2f2f inset; color:#ff9c98 }
  .leave:active{ transform:translateY(1px) }
  .tip{ font-size:12px; color:var(--ink-faint); line-height:1.55; margin-top:16px }
</style>
</head>
<body>
  <div class="card">
    <div class="status-lamp" id="lamp"></div>
    <h1>Backup rig</h1>
    <div class="state" id="state">connecting to host…</div>

    <div class="rows">
      <div class="row"><span class="k">Host</span><span class="v" id="rHost">—</span></div>
      <div class="row"><span class="k">Target app</span><span class="v" id="rTarget">frontmost</span></div>
      <div class="row"><span class="k">Rigs online</span><span class="v" id="rCount">—</span></div>
    </div>

    <div class="warn" id="warn"></div>
    <button class="leave" id="leave">Leave session</button>
    <div class="tip">Keep this window open and the teleprompter app in front. This Mac mirrors every scroll and click from the host.</div>
  </div>

<script>
  const q = new URLSearchParams(location.search);
  const host = q.get('host') || '';
  const target = q.get('target') || '';
  const keypost = q.get('keypost') === '1';

  document.getElementById('rHost').textContent = host || '—';
  document.getElementById('rTarget').textContent = target || 'frontmost';
  if (!keypost) {
    const w = document.getElementById('warn');
    w.classList.add('show');
    w.textContent = 'keypost helper not built — mouse mirroring is off and keys use a focus-switching fallback. Install Xcode tools (xcode-select --install) and rejoin for full control.';
  }

  const lamp = document.getElementById('lamp');
  const state = document.getElementById('state');
  const rCount = document.getElementById('rCount');
  async function ping(){
    try {
      const r = await fetch(host + '/status', { cache: 'no-store' });
      const s = await r.json();
      lamp.classList.add('live'); state.textContent = 'linked to host';
      rCount.textContent = s.count;
    } catch (_) {
      lamp.classList.remove('live'); state.textContent = 'host offline — will reconnect';
      rCount.textContent = '—';
    }
  }
  ping(); setInterval(ping, 2000);

  document.getElementById('leave').addEventListener('click', () => window.tss.leave());
</script>
</body>
</html>

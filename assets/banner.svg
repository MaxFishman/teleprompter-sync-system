<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191e25"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6bd63"/>
      <stop offset="1" stop-color="#f4a836"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="78%" cy="40%" r="60%">
      <stop offset="0" stop-color="#1f2630" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#vig)"/>

  <!-- reading-line motif on the right -->
  <g transform="translate(830,96)">
    <rect x="0"  y="0"   width="300" height="16" rx="8" fill="url(#amber)" opacity="0.22"/>
    <rect x="0"  y="46"  width="360" height="16" rx="8" fill="url(#amber)" opacity="0.40"/>
    <rect x="0"  y="98"  width="360" height="30" rx="15" fill="url(#amber)" filter="url(#glow)"/>
    <rect x="0"  y="158" width="320" height="16" rx="8" fill="url(#amber)" opacity="0.40"/>
    <rect x="0"  y="204" width="230" height="16" rx="8" fill="url(#amber)" opacity="0.22"/>
    <circle cx="360" cy="113" r="12" fill="#f6bd63"/>
    <circle cx="0"   cy="113" r="12" fill="#f6bd63"/>
  </g>

  <!-- glyph -->
  <g transform="translate(96,120)">
    <rect x="0" y="0" width="86" height="86" rx="22" fill="#171c22" stroke="#2a3038" stroke-width="2"/>
    <rect x="20" y="26" width="46" height="7" rx="3.5" fill="url(#amber)" opacity="0.95"/>
    <rect x="20" y="40" width="46" height="7" rx="3.5" fill="url(#amber)" opacity="0.6"/>
    <rect x="20" y="54" width="46" height="7" rx="3.5" fill="url(#amber)" opacity="0.32"/>
  </g>

  <!-- wordmark -->
  <text x="208" y="162" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="2" fill="#edeff2">TELEPROMPTER SYNC SYSTEM</text>
  <text x="210" y="198" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="2" fill="#f6bd63">TSS</text>
  <text x="252" y="198" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#7e8893">· redundant teleprompter link for macOS</text>
  <text x="208" y="250" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#c9cdd3">Two rigs. One operator. Zero drift.</text>
</svg>

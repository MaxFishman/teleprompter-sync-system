<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a33"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6bd63"/>
      <stop offset="1" stop-color="#f4a836"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- full-bleed; iOS applies its own rounded mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g>
    <rect x="300" y="322" width="320" height="40" rx="20" fill="url(#amber)" opacity="0.30"/>
    <rect x="300" y="410" width="424" height="40" rx="20" fill="url(#amber)" opacity="0.52"/>
    <rect x="300" y="492" width="424" height="76" rx="38" fill="url(#amber)" filter="url(#glow)"/>
    <rect x="300" y="628" width="372" height="40" rx="20" fill="url(#amber)" opacity="0.52"/>
    <rect x="300" y="716" width="264" height="40" rx="20" fill="url(#amber)" opacity="0.30"/>
  </g>
  <circle cx="724" cy="530" r="26" fill="#f6bd63"/>
  <circle cx="300" cy="530" r="26" fill="#f6bd63"/>
</svg>
